name: Rust
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install just
      uses: taiki-e/install-action@just
    - uses: actions/checkout@v4
    - name: Build
      run: just build
    - name: Run tests
      run: just test
      
